x-app-python-service: &app-python-service
  image: python:3.11-slim
  working_dir: /app
  volumes:
    - ./:/app
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-app-runtime-env: &app-runtime-env
  APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://fetchnews:fetchnews@host.docker.internal:5432/fetchnews}
  APP_DATABASE_BOOTSTRAP_MODE: ${APP_DATABASE_BOOTSTRAP_MODE:-skip}

x-app-service-env: &app-service-env
  <<: *app-runtime-env
  APP_REDIS_URL: redis://redis:6379/0
  APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-true}
  APP_AUTH_SECRET_KEY: ${APP_AUTH_SECRET_KEY:-fetchnews-dev-secret}
  APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-admin}
  APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-admin-secret}

services:
  migrate:
    <<: *app-python-service
    command: sh -c "pip install -e .[dev] && alembic upgrade head"
    environment:
      <<: *app-runtime-env

  api:
    <<: *app-python-service
    command: sh -c "pip install -e .[dev] && uvicorn fetchnews.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      <<: *app-service-env
    depends_on:
      - migrate
      - redis

  worker:
    <<: *app-python-service
    command: sh -c "pip install -e .[dev] && celery -A fetchnews.tasks.worker.celery_app worker --loglevel=info"
    environment:
      <<: *app-service-env
    depends_on:
      - migrate
      - redis

  beat:
    <<: *app-python-service
    command: sh -c "pip install -e .[dev] && celery -A fetchnews.tasks.worker.celery_app beat --loglevel=info"
    environment:
      <<: *app-service-env
    depends_on:
      - migrate
      - redis

  web:
    image: node:20-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
